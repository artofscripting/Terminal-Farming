<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1/user-scalable=no plus touch-action: none below stop
       pinch- and double-tap-zoom from fighting the fixed terminal grid --
       there's nothing to zoom into here, just characters at a fixed size. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terminal Harvest</title>
  <!-- PWA installability: manifest + icons so "Add to Home Screen" opens a
       real standalone app window instead of just a bookmarked browser tab.
       Relative hrefs (not /-prefixed) so these resolve correctly whether
       the page is served from a domain root, a GitHub Pages project
       subpath, or opened as a standalone file. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#101810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Terminal Harvest" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #terminal {
      width: 100vw;
      touch-action: none;
      /* 100vh on mobile Safari/Chrome is the height with the address bar
         hidden -- with it showing (the common case on load), that overflows
         the actually-visible viewport and pushes the bottom rows off
         screen. 100dvh tracks the real visible viewport as browser chrome
         shows/hides; the plain vh above is just the fallback for browsers
         that don't support dvh yet. */
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      box-sizing: border-box;
    }

    /* On-screen touch controls (web/main.js): a D-pad + contextual action
       buttons overlaid on the terminal so mobile play never needs the OS
       keyboard for ordinary actions. Fixed position, semi-transparent, high
       z-index so they sit on top of (and intercept taps meant for) the map
       below -- tap-to-move only listens on the terminal element itself, so
       a tap landing on a button here never reaches it. Hidden by default;
       JS shows them automatically on a touch-capable device, and
       #touch-toggle flips them manually either way. --vpad (top/bottom
       padding, ~3 terminal lines) is set from JS since it depends on the
       auto-shrunk font's actual row height. */
    #touch-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: var(--vpad, 24px) 10px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
      gap: 8px;
    }
    #touch-controls.visible { display: flex; }
    #touch-controls .pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
      pointer-events: auto;
    }
    #touch-controls button {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 1px solid rgba(200, 220, 200, 0.35);
      background: rgba(20, 30, 24, 0.55);
      color: #dce8dc;
      font: 15px "Cascadia Mono", "Courier New", monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #touch-controls button:active {
      background: rgba(90, 140, 90, 0.6);
    }
    /* Page-tab buttons (ui/touchActions.js's paginate(), for a mode with
       more than 16 relevant actions at once) -- the active page's tab
       stays visibly highlighted between taps, not just on :active press. */
    #touch-controls .actions button.active {
      background: rgba(70, 150, 70, 0.55);
      border-color: rgba(140, 230, 140, 0.7);
    }
    #touch-controls .dpad-up { grid-column: 2; grid-row: 1; }
    #touch-controls .dpad-left { grid-column: 1; grid-row: 2; }
    #touch-controls .dpad-right { grid-column: 3; grid-row: 2; }
    #touch-controls .dpad-down { grid-column: 2; grid-row: 3; }
    /* Contextual action buttons (web/main.js + ui/touchActions.js): count
       and labels vary with what's actually possible right now (up to 16),
       so this wraps by content rather than a fixed grid -- min-width keeps
       the 44px touch-target floor, but a longer label like "Dismount" can
       grow past that instead of getting clipped. */
    #touch-controls .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: flex-end;
      gap: 4px;
      max-width: 62vw;
      pointer-events: auto;
    }
    #touch-controls .actions button {
      min-width: 44px;
      height: 44px;
      padding: 0 6px;
      font-size: 10px;
      line-height: 1.1;
      white-space: nowrap;
    }
    #touch-toggle {
      position: fixed;
      right: 8px;
      /* Below the HUD header (web/main.js computes --header-h from
         render.js's HUD_ROWS) instead of a fixed offset, so it never
         overlaps header text -- notably the starting-options corner drawn
         at the top-right of line 1 during normal play. */
      top: calc(var(--header-h, 60px) + 8px);
      z-index: 11;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(200, 220, 200, 0.35);
      background: rgba(20, 30, 24, 0.55);
      color: #dce8dc;
      font-size: 16px;
      touch-action: manipulation;
    }

    /* Landscape suggestion (web/main.js): shown only when fitToWidth() had
       to shrink the font all the way to its legibility floor and still
       couldn't comfortably fit -- a genuine signal rotating would help,
       not just "you're in portrait." Dismissible; never blocks play. */
    #rotate-suggest {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 12;
      min-height: 44px;
      padding: 8px 56px 8px 12px;
      box-sizing: border-box;
      background: rgba(40, 30, 10, 0.85);
      color: #f0dca0;
      font: 13px "Cascadia Mono", "Courier New", monospace;
      border-bottom: 1px solid rgba(240, 220, 160, 0.35);
    }
    #rotate-suggest.visible { display: block; }
    #rotate-dismiss {
      position: absolute;
      right: 4px;
      top: 0;
      width: 44px;
      height: 44px;
      border-radius: 6px;
      border: 1px solid rgba(240, 220, 160, 0.35);
      background: transparent;
      color: #f0dca0;
      font-size: 14px;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="rotate-suggest">Rotate your device for a more comfortable view. <button id="rotate-dismiss" title="Dismiss">&times;</button></div>
  <button id="touch-toggle" title="Toggle touch controls">&#9639;</button>
  <div id="touch-controls">
    <div class="pad" id="touch-dpad">
      <button class="dpad-up" data-key="up">&#9650;</button>
      <button class="dpad-left" data-key="left">&#9664;</button>
      <button class="dpad-right" data-key="right">&#9654;</button>
      <button class="dpad-down" data-key="down">&#9660;</button>
    </div>
    <!-- Populated dynamically by web/main.js from ui/touchActions.js's
         contextualActions() -- see that module for what shows up when. -->
    <div class="actions" id="touch-actions"></div>
  </div>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
