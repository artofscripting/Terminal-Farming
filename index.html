<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1/user-scalable=no plus touch-action: none below stop
       pinch- and double-tap-zoom from fighting the fixed terminal grid --
       there's nothing to zoom into here, just characters at a fixed size. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Terminal Harvest</title>
  <!-- PWA installability: manifest + icons so "Add to Home Screen" opens a
       real standalone app window instead of just a bookmarked browser tab.
       Relative hrefs (not /-prefixed) so these resolve correctly whether
       the page is served from a domain root, a GitHub Pages project
       subpath, or opened as a standalone file. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#101810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Terminal Harvest" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #terminal {
      width: 100vw;
      touch-action: none;
      /* 100vh on mobile Safari/Chrome is the height with the address bar
         hidden -- with it showing (the common case on load), that overflows
         the actually-visible viewport and pushes the bottom rows off
         screen. 100dvh tracks the real visible viewport as browser chrome
         shows/hides; the plain vh above is just the fallback for browsers
         that don't support dvh yet. */
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      box-sizing: border-box;
    }

    /* On-screen touch controls (web/main.js): a D-pad + contextual action
       buttons overlaid on the terminal so mobile play never needs the OS
       keyboard for ordinary actions. Fixed position, semi-transparent, high
       z-index so they sit on top of (and intercept taps meant for) the map
       below -- tap-to-move only listens on the terminal element itself, so
       a tap landing on a button here never reaches it. Hidden by default;
       JS shows them automatically on a touch-capable device, and
       #touch-toggle flips them manually either way. --vpad (top/bottom
       padding, ~3 terminal lines) is set from JS since it depends on the
       auto-shrunk font's actual row height. */
    #touch-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: var(--vpad, 24px) 10px;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
      gap: 8px;
    }
    #touch-controls.visible { display: flex; }
    #touch-controls .pad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
      pointer-events: auto;
    }
    #touch-controls button {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      border: 1px solid rgba(200, 220, 200, 0.35);
      background: rgba(20, 30, 24, 0.95);
      color: #dce8dc;
      font: 15px "Cascadia Mono", "Courier New", monospace;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #touch-controls button:active {
      background: rgba(90, 140, 90, 0.95);
    }
    #touch-controls .dpad-up { grid-column: 2; grid-row: 1; }
    #touch-controls .dpad-left { grid-column: 1; grid-row: 2; }
    #touch-controls .dpad-right { grid-column: 3; grid-row: 2; }
    #touch-controls .dpad-down { grid-column: 2; grid-row: 3; }
    /* Wraps the page-tab strip (.tabs) above the action buttons (.actions)
       so they stack as one right-aligned column -- see .tabs below for why
       they're split into two rows instead of one mixed flex-wrap. */
    #touch-controls .action-group {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
    }
    /* Contextual action buttons (web/main.js + ui/touchActions.js): count
       and labels vary with what's actually possible right now (up to 16),
       so this wraps by content rather than a fixed grid -- min-width keeps
       the 44px touch-target floor. Labels stay abbreviated (web/main.js
       breaks a two-word label after the first word) rather than growing the
       button wide to fit both words on one line. */
    #touch-controls .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: flex-end;
      gap: 4px;
      max-width: 62vw;
      pointer-events: auto;
    }
    #touch-controls .actions button {
      min-width: 44px;
      height: 44px;
      padding: 2px 6px;
      font-size: 10px;
      line-height: 1.15;
      white-space: pre-line;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    /* Page-tab buttons (ui/touchActions.js's paginate(), for a mode with
       more than 16 relevant actions at once): a real tab strip sitting just
       above the action buttons they switch between, instead of one more
       button mixed in among them -- flat-bottomed and slightly dimmer when
       inactive, so the active tab reads as "open" into the panel below it. */
    #touch-controls .tabs {
      display: flex;
      justify-content: flex-end;
      gap: 3px;
      max-width: 62vw;
      pointer-events: auto;
    }
    #touch-controls .tabs button {
      min-width: 34px;
      height: 26px;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 6px 6px 0 0;
      border-bottom: none;
      background: rgba(20, 30, 24, 0.95);
      color: #93a693;
    }
    #touch-controls .tabs button.active {
      background: rgba(70, 150, 70, 0.95);
      border-color: rgba(140, 230, 140, 0.7);
      color: #eaffea;
    }
    /* Once a tab strip is actually showing, give the action panel below it
       a matching top edge so the active tab looks attached to it rather
       than floating -- :has() keeps this scoped to only when tabs exist,
       so the common (unpaginated) case is untouched. */
    #touch-controls .action-group:has(.tabs button) .actions {
      border-top: 1px solid rgba(140, 230, 140, 0.35);
      padding-top: 6px;
    }

    /* Top-right corner cluster: font size +/- next to the touch-controls
       show/hide toggle. Below the HUD header (web/main.js computes
       --header-h from render.js's currentHudRows, which grows if the
       header wraps to fit a narrow width) instead of a fixed offset, so it
       never overlaps header text -- notably the starting-options corner
       drawn at the top-right of line 1 during normal play. */
    #header-controls {
      position: fixed;
      right: 8px;
      top: calc(var(--header-h, 60px) + 8px);
      z-index: 11;
      display: flex;
      gap: 6px;
    }
    #header-controls button {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(200, 220, 200, 0.35);
      background: rgba(20, 30, 24, 0.95);
      color: #dce8dc;
      font-size: 16px;
      touch-action: manipulation;
    }
    #header-controls button:disabled {
      opacity: 0.35;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="header-controls">
    <button id="font-dec" title="Decrease font size">A&minus;</button>
    <button id="font-inc" title="Increase font size">A&plus;</button>
    <button id="touch-toggle" title="Toggle touch controls">&#9639;</button>
  </div>
  <div id="touch-controls">
    <div class="pad" id="touch-dpad">
      <button class="dpad-up" data-key="up">&#9650;</button>
      <button class="dpad-left" data-key="left">&#9664;</button>
      <button class="dpad-right" data-key="right">&#9654;</button>
      <button class="dpad-down" data-key="down">&#9660;</button>
    </div>
    <!-- Both populated dynamically by web/main.js from ui/touchActions.js's
         contextualActions() -- page-tab entries (key "__page:N") go in
         .tabs, everything else in .actions. See that module for what shows
         up when. -->
    <div class="action-group">
      <div class="tabs" id="touch-tabs"></div>
      <div class="actions" id="touch-actions"></div>
    </div>
  </div>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
